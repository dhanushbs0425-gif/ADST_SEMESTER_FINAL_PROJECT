{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h3 class="fw-bold mb-0"><i class="fa-solid fa-cloud-arrow-up text-primary me-2"></i>Upload Seed Image</h3>
                <p class="text-muted small mb-0">Upload a single seed image or a multi-seed tray image for automated inspection</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
                    
                    <!-- Drag and Drop Zone -->
                    <div class="drop-zone mb-4" id="drop-zone">
                        <i class="fa-solid fa-file-image"></i>
                        <h5>Drag & Drop Seed Image Here</h5>
                        <p class="text-muted small mb-2">or click to browse from computer</p>
                        <span class="btn btn-outline-primary btn-sm">Browse Image</span>
                        <input type="file" name="file" id="file-input" class="d-none" accept="image/*" required>
                    </div>

                    <!-- Image Preview -->
                    <div id="preview-container" class="mb-4 text-center d-none">
                        <h6 class="fw-bold text-muted mb-2">Selected Image Preview:</h6>
                        <div class="result-img-box d-inline-block" style="max-width: 300px;">
                            <img id="image-preview" src="#" alt="Preview">
                        </div>
                    </div>

                    <!-- Model Choice -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Select AI Architecture Model:</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-check card p-3 h-100">
                                    <input class="form-check-input" type="radio" name="model_type" id="model_dl" value="dl" checked>
                                    <label class="form-check-label fw-bold" for="model_dl">
                                        <i class="fa-solid fa-brain text-primary me-1"></i> Two-Stage Deep Learning (MobileNetV3)
                                        <div class="text-muted small fw-normal">High precision transfer learning model trained on PyTorch</div>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check card p-3 h-100">
                                    <input class="form-check-input" type="radio" name="model_type" id="model_ml" value="ml">
                                    <label class="form-check-label fw-bold" for="model_ml">
                                        <i class="fa-solid fa-gears text-success me-1"></i> Traditional CV + ML (SVM / Random Forest)
                                        <div class="text-muted small fw-normal">Extracts Color, Shape, and GLCM Texture features</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary btn-lg px-4"><i class="fa-solid fa-magnifying-glass me-2"></i>Analyze Seed</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
